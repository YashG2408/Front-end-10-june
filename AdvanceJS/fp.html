<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch method to product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="row">

        </div>
    </div>

    <script>

        function data(){
            fetch("https://dummyjson.com/products",{
                method: "GET"
            })
            .then((res)=>{
                return res.json()
            })
            .then((res)=>{
                console.log(res.products);

                let carddata = res.products.map((card)=>{
                    console.log(card);
                    return(
                        `
                         <div class="col-md-4">
                             <div class="card" style="width: 18rem;">
                           <img src="${card.images[0]}" alt="...">
                               <div class="card-body">
                                   <h5 class="card-title">${card.title.slice(0,15)}</h5>
                                   <p class="card-description">${card.description.slice(0,80)}</p>
                                   <h5 class="card-price">${card.price}</h5>
                                   <h5 class="card-title">${card.tags}</h5>
                                       <a href="#" class="btn btn-primary">Shop Now</a>
                              </div>
                        </div>
                        </div>
                        `
                    )
                    
                })

                document.querySelector(".row").innerHTML += carddata.join("")
            })

        }
        data()
    </script>
    
</body>
</html>
